<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>9mm Girls — Volume 1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      text-align: center;
    }

    img {
      display: block;
      width: 100%;
      max-width: 1200px;
      height: auto;
      margin: 0 auto;
    }

    .back {
      display: block;
      padding: 25px;
      background: #181818;
      color: #aaa;
      text-decoration: none;
      font-family: Arial, sans-serif;
    }

    .back:hover {
      color: white;
    }
  </style>
</head>

<body>

  <div id="comic"></div>

  <a class="back" href="../">← Back to 9mm Girls</a>

  <script>
    const comic = document.getElementById("comic");

    for (let page = 1; page <= 69; page++) {

      const number = String(page).padStart(2, "0");

      const image = document.createElement("img");

      image.src = `Page-${number} Large.jpeg`;

      image.alt = `9mm Girls — Page ${page}`;

      comic.appendChild(image);
    }
  </script>

</body>
</html>
