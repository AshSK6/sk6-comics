<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9mm Girls — Volume 1</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    .reader {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .spread {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 1400px;
    }
    .spread img {
      display: block;
      max-width: 50%;
      max-height: 78vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    button {
      background: white;
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    #spread-number {
      color: #aaa;
      min-width: 100px;
      text-align: center;
    }
    .back {
      display: block;
      padding: 20px;
      background: #181818;
      color: #aaa;
      text-decoration: none;
      text-align: center;
    }
    @media (max-width: 700px) {
      .spread {
        flex-direction: column;
      }
      .spread img {
        max-width: 100%;
        max-height: 55vh;
      }
    }
  </style>
</head>
<body>
  <div class="reader">
    <div class="spread">
      <img id="page-left" src="../Page-01%20Large.jpeg" alt="9mm Girls">
      <img id="page-right" src="../Page-02%20Large.jpeg" alt="9mm Girls">
    </div>
    <div class="controls">
      <button id="previous" disabled>
        ← Previous
      </button>
      <span id="spread-number">
        Pages 1–2
      </span>
      <button id="next">
        Next →
      </button>
    </div>
  </div>
  <a class="back" href="../">
    ← Back to 9mm Girls
  </a>
  <script>
    let currentSpread = 0;
    const totalPages = 69;
    const pageLeft =
      document.getElementById("page-left");
    const pageRight =
      document.getElementById("page-right");
    const spreadNumber =
      document.getElementById("spread-number");
    const previousButton =
      document.getElementById("previous");
    const nextButton =
      document.getElementById("next");
    function getFilename(page) {
      const number =
        String(page).padStart(2, "0");
      return "../Page-" + number + "%20Large.jpeg";
    }
    function showSpread(spread) {
      currentSpread = spread;
      const leftPage =
        currentSpread * 2 + 1;
      const rightPage =
        leftPage + 1;
      pageLeft.src =
        getFilename(leftPage);
      pageLeft.alt =
        "9mm Girls — Page " + leftPage;
      if (rightPage <= totalPages) {
        pageRight.src =
          getFilename(rightPage);
        pageRight.alt =
          "9mm Girls — Page " + rightPage;
        pageRight.style.display = "block";
        spreadNumber.textContent =
          "Pages " + leftPage + "–" + rightPage;
      } else {
        pageRight.style.display = "none";
        spreadNumber.textContent =
          "Page " + leftPage;
      }
      previousButton.disabled =
        currentSpread === 0;
      const lastSpread =
        Math.floor((totalPages - 1) / 2);
      nextButton.disabled =
        currentSpread === lastSpread;
      window.scrollTo(0, 0);
    }
    previousButton.addEventListener(
      "click",
      function() {
        if (currentSpread > 0) {
          showSpread(currentSpread - 1);
        }
      }
    );
    nextButton.addEventListener(
      "click",
      function() {
        const lastSpread =
          Math.floor((totalPages - 1) / 2);
        if (currentSpread < lastSpread) {
          showSpread(currentSpread + 1);
        }
      }
    );
    document.addEventListener(
      "keydown",
      function(event) {
        if (event.key === "ArrowRight") {
          const lastSpread =
            Math.floor((totalPages - 1) / 2);
          if (currentSpread < lastSpread) {
            showSpread(currentSpread + 1);
          }
        }
        if (event.key === "ArrowLeft") {
          if (currentSpread > 0) {
            showSpread(currentSpread - 1);
          }
        }
      }
    );
    showSpread(0);
  </script>
</body>
</html>
