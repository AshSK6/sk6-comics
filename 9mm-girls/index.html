<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>9mm Girls — SK6</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 50px 20px;
      background: #181818;
    }

    h1 {
      font-size: 42px;
      margin: 0;
    }

    header p {
      color: #999;
      margin-top: 10px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 50px 20px;
    }

    .volumes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .volume {
      background: #1c1c1c;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
    }

    .volume h2 {
      margin-top: 0;
    }

    .volume p {
      color: #999;
    }

    .volume a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 50px;
      color: #999;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>9mm Girls</h1>
    <p>A comic by SK6</p>
  </header>

  <main>

    <h2>Volumes</h2>

    <div class="volumes">

      <div class="volume">
        <h2>Volume 1</h2>
        <p>Read Volume 1</p>
        <a href="volume-1/">READ</a>
      </div>

      <div class="volume">
        <h2>Volume 2</h2>
        <p>Read Volume 2</p>
        <a href="volume-2/">READ</a>
      </div>

      <div class="volume">
        <h2>Volume 3</h2>
        <p>Coming soon</p>
      </div>

    </div>

    <a class="back" href="../">← Back to SK6</a>

  </main>

</body>
</html>
