<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>L’Héritage de la Nuit — Chapter 01 — SK6</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --black: #080808;
  --white: #f2f2ee;
  --gold: #c9a45c;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  background: var(--black);
  color: var(--white);

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body {
  overflow-x: hidden;
}


/* ========================= */
/* TOP BAR */
/* ========================= */

.topbar {

  width: 100%;

  padding:
    15px
    20px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  border-bottom:
    2px solid
    var(--white);

  position: sticky;

  top: 0;

  background: var(--black);

  z-index: 100;
}


/* ========================= */
/* SK6 RETURN */
/* ========================= */

.logo {

  color: var(--gold);

  text-decoration: none;

  font-size: 18px;

  font-weight: 900;

  letter-spacing: 4px;

  transition:
    color .15s ease,
    transform .15s ease;
}

.logo:hover {

  color: var(--white);

  transform:
    translateY(-2px);
}


/* ========================= */
/* CENTER TITLE */
/* ========================= */

.chapter-title {

  font-size: 11px;

  font-weight: 900;

  letter-spacing: 3px;

  text-transform: uppercase;

  text-align: center;
}


/* ========================= */
/* SERIES RETURN */
/* ========================= */

.back {

  color: var(--white);

  text-decoration: none;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 2px;

  text-transform: uppercase;

  transition:
    color .15s ease;
}

.back:hover {

  color: var(--gold);
}


/* ========================= */
/* READER */
/* ========================= */

.reader {

  width: 100%;

  max-width: 1500px;

  margin: 0 auto;

  padding:
    30px
    20px
    100px;
}


/* ========================= */
/* PAGE SPREAD */
/* ========================= */

.spread {

  width: 100%;

  display: flex;

  flex-direction: row;

  justify-content: center;

  align-items: flex-start;

  gap: 12px;

  direction: ltr;

  margin: 0 auto;
}


/*
  L’HÉRITAGE DE LA NUIT

  Page 1 = LEFT
  Page 2 = RIGHT

  Page 3 = LEFT
  Page 4 = RIGHT

  etc.
*/

.page {

  width: 50%;

  display: block;

  max-width: 700px;

  height: auto;

  object-fit: contain;

  background: var(--black);

  border:
    3px solid
    var(--white);

  margin: 0;

  padding: 0;
}


/* ========================= */
/* NAVIGATION */
/* ========================= */

.controls {

  width: 100%;

  max-width: 900px;

  margin:
    35px auto
    0;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 20px;
}


.control {

  border: none;

  background: var(--gold);

  color: var(--black);

  padding:
    12px
    18px;

  font-size: 11px;

  font-weight: 900;

  letter-spacing: 2px;

  text-transform: uppercase;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .15s ease,
    color .15s ease;
}

.control:hover {

  transform:
    translateY(-3px);

  background: var(--white);

  color: var(--black);
}

.control:disabled {

  opacity: .25;

  cursor: default;

  transform: none;
}


/* ========================= */
/* PAGE COUNTER */
/* ========================= */

.counter {

  text-align: center;

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 3px;

  color: var(--gold);

  text-transform: uppercase;

  margin-top: 18px;
}


/* ========================= */
/* FOOTER */
/* ========================= */

.footer {

  width: 100%;

  max-width: 900px;

  margin:
    50px auto
    0;

  padding-top: 20px;

  border-top:
    2px solid
    rgba(242,242,238,.25);

  display: flex;

  justify-content: space-between;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 3px;

  text-transform: uppercase;

  opacity: .5;
}

.footer span:last-child {

  color: var(--gold);
}


/* ========================= */
/* MOBILE */
/* ========================= */

@media (max-width: 800px) {

  .topbar {

    padding:
      13px
      15px;
  }

  .chapter-title {

    font-size: 9px;

    letter-spacing: 2px;
  }

  .back {

    font-size: 9px;

    letter-spacing: 1px;
  }

  .reader {

    padding:
      15px
      8px
      80px;
  }

  .spread {

    gap: 4px;
  }

  .page {

    width: 50%;

    max-width: none;
  }

  .controls {

    margin-top: 25px;

    padding:
      0
      5px;
  }

  .control {

    padding:
      11px
      12px;

    font-size: 9px;

    letter-spacing: 1px;
  }

  .footer {

    padding:
      0
      5px;

    font-size: 8px;
  }

}


/* ========================= */
/* VERY SMALL SCREENS */
/* ========================= */

@media (max-width: 500px) {

  .spread {

    gap: 2px;
  }

  .page {

    width: 50%;
  }

  .chapter-title {

    max-width: 120px;
  }

}

</style>

</head>


<body>


<!-- ========================= -->
<!-- TOP BAR -->
<!-- ========================= -->

<div class="topbar">


  <!-- BACK TO SK6 -->

  <a
    class="logo"
    href="../../"
  >

    SK6

  </a>


  <!-- TITLE -->

  <div class="chapter-title">

    L’HÉRITAGE DE LA NUIT
    //
    CHAPTER 01

  </div>


  <!-- BACK TO SERIES -->

  <a
    class="back"
    href="../"
  >

    Series

  </a>


</div>



<!-- ========================= -->
<!-- READER -->
<!-- ========================= -->

<main class="reader">


  <div
    class="spread"
    id="spread"
  >

    <!-- Pages inserted by JavaScript -->

  </div>



  <!-- ========================= -->
  <!-- CONTROLS -->
  <!-- ========================= -->

  <div class="controls">


    <button
      class="control"
      id="previousButton"
      onclick="previousSpread()"
    >

      ← PREVIOUS

    </button>


    <button
      class="control"
      id="nextButton"
      onclick="nextSpread()"
    >

      NEXT →

    </button>


  </div>



  <!-- ========================= -->
  <!-- COUNTER -->
  <!-- ========================= -->

  <div
    class="counter"
    id="counter"
  >

    PAGES 1–2 / 19

  </div>



  <!-- ========================= -->
  <!-- FOOTER -->
  <!-- ========================= -->

  <div class="footer">

    <span>

      SK6 // L’HÉRITAGE DE LA NUIT

    </span>


    <span>

      001 / 019

    </span>

  </div>


</main>



<script>


/* ========================= */
/* SETTINGS */
/* ========================= */

const totalPages = 19;

let currentSpread = 0;


/* ========================= */
/* ELEMENTS */
/* ========================= */

const spread =
  document.getElementById(
    "spread"
  );

const counter =
  document.getElementById(
    "counter"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const previousButton =
  document.getElementById(
    "previousButton"
  );


/* ========================= */
/* PAGE FILENAME */
/* ========================= */

/*
  IMPORTANT:

  The reader is INSIDE Chapter1.

  The images are ALSO inside Chapter1.

  Therefore we DO NOT use ../ here.

  GitHub filename:

  H_c1_01 Large.jpeg

  The space is encoded as %20.
*/

function getFilename(page) {

  const number =
    String(page).padStart(2, "0");

  return (
    "H_c1_" +
    number +
    "%20Large.jpeg"
  );

}


/* ========================= */
/* SHOW SPREAD */
/* ========================= */

function showSpread() {

  spread.innerHTML = "";


  const firstPage =
    currentSpread * 2 + 1;


  const secondPage =
    firstPage + 1;



  /* ========================= */
  /* FIRST PAGE */
  /* ========================= */

  if (
    firstPage <= totalPages
  ) {

    const leftPage =
      document.createElement(
        "img"
      );


    leftPage.className =
      "page";


    leftPage.src =
      getFilename(
        firstPage
      );


    leftPage.alt =
      "L’Héritage de la Nuit — Page " +
      firstPage;


    leftPage.loading =
      "eager";


    spread.appendChild(
      leftPage
    );

  }



  /* ========================= */
  /* SECOND PAGE */
  /* ========================= */

  if (
    secondPage <= totalPages
  ) {

    const rightPage =
      document.createElement(
        "img"
      );


    rightPage.className =
      "page";


    rightPage.src =
      getFilename(
        secondPage
      );


    rightPage.alt =
      "L’Héritage de la Nuit — Page " +
      secondPage;


    rightPage.loading =
      "eager";


    spread.appendChild(
      rightPage
    );

  }



  /* ========================= */
  /* COUNTER */
  /* ========================= */

  if (
    secondPage <= totalPages
  ) {

    counter.textContent =
      "PAGES " +
      firstPage +
      "–" +
      secondPage +
      " / " +
      totalPages;

  }

  else {

    counter.textContent =
      "PAGE " +
      firstPage +
      " / " +
      totalPages;

  }



  /* ========================= */
  /* BUTTON STATES */
  /* ========================= */

  previousButton.disabled =
    currentSpread === 0;


  nextButton.disabled =
    secondPage >= totalPages;

}


/* ========================= */
/* NEXT */
/* ========================= */

function nextSpread() {

  const lastSpread =
    Math.ceil(
      totalPages / 2
    ) - 1;


  if (
    currentSpread <
    lastSpread
  ) {

    currentSpread++;


    showSpread();


    window.scrollTo({

      top: 0,

      behavior: "smooth"

    });

  }

}


/* ========================= */
/* PREVIOUS */
/* ========================= */

function previousSpread() {

  if (
    currentSpread > 0
  ) {

    currentSpread--;


    showSpread();


    window.scrollTo({

      top: 0,

      behavior: "smooth"

    });

  }

}


/* ========================= */
/* KEYBOARD */
/* ========================= */

document.addEventListener(

  "keydown",

  function(event) {


    /* RIGHT ARROW = NEXT */

    if (
      event.key === "ArrowRight"
    ) {

      nextSpread();

    }


    /* LEFT ARROW = PREVIOUS */

    if (
      event.key === "ArrowLeft"
    ) {

      previousSpread();

    }

  }

);


/* ========================= */
/* START READER */
/* ========================= */

showSpread();

</script>


</body>

</html>
