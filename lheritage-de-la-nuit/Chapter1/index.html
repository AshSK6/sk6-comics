<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>L’Héritage de la Nuit — Chapter 01 — SK6</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --black: #080808;
  --white: #f2f2ee;
  --gold: #c9a45c;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  background:
    var(--black);

  color:
    var(--white);

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body {
  overflow-x: hidden;
}


/* ========================= */
/* TOP BAR */
/* ========================= */

.topbar {

  width: 100%;

  padding:
    15px 20px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  border-bottom:
    2px solid
    var(--white);

  position: sticky;

  top: 0;

  background:
    var(--black);

  z-index: 100;
}


.logo {

  color:
    var(--gold);

  text-decoration:
    none;

  font-size:
    18px;

  font-weight:
    900;

  letter-spacing:
    4px;
}


.logo:hover {

  color:
    var(--white);
}


.chapter-title {

  font-size:
    11px;

  font-weight:
    900;

  letter-spacing:
    3px;

  text-transform:
    uppercase;

  text-align:
    center;
}


.back {

  color:
    var(--white);

  text-decoration:
    none;

  font-size:
    10px;

  font-weight:
    900;

  letter-spacing:
    2px;

  text-transform:
    uppercase;
}


.back:hover {

  color:
    var(--gold);
}


/* ========================= */
/* READER */
/* ========================= */

.reader {

  width:
    100%;

  max-width:
    1500px;

  margin:
    0 auto;

  padding:
    30px 20px 100px;
}


/* PAGE SPREAD */

.spread {

  width:
    100%;

  display:
    flex;

  flex-direction:
    row;

  justify-content:
    center;

  align-items:
    flex-start;

  gap:
    12px;
}


/* PAGE */

.page {

  width:
    50%;

  max-width:
    700px;

  height:
    auto;

  display:
    block;

  object-fit:
    contain;

  background:
    var(--black);

  border:
    3px solid
    var(--white);
}


/* ========================= */
/* CONTROLS */
/* ========================= */

.controls {

  width:
    100%;

  max-width:
    900px;

  margin:
    35px auto 0;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;
}


.control {

  border:
    none;

  background:
    var(--gold);

  color:
    var(--black);

  padding:
    12px 18px;

  font-size:
    11px;

  font-weight:
    900;

  letter-spacing:
    2px;

  text-transform:
    uppercase;

  cursor:
    pointer;
}


.control:hover {

  background:
    var(--white);
}


.control:disabled {

  opacity:
    .25;

  cursor:
    default;
}


/* ========================= */
/* COUNTER */
/* ========================= */

.counter {

  text-align:
    center;

  font-size:
    10px;

  font-weight:
    900;

  letter-spacing:
    3px;

  color:
    var(--gold);

  text-transform:
    uppercase;

  margin-top:
    18px;
}


/* ========================= */
/* FOOTER */
/* ========================= */

.footer {

  width:
    100%;

  max-width:
    900px;

  margin:
    50px auto 0;

  padding-top:
    20px;

  border-top:
    2px solid
    rgba(242,242,238,.25);

  display:
    flex;

  justify-content:
    space-between;

  font-size:
    9px;

  font-weight:
    900;

  letter-spacing:
    3px;

  text-transform:
    uppercase;

  opacity:
    .5;
}


.footer span:last-child {

  color:
    var(--gold);
}


/* ========================= */
/* MOBILE */
/* ========================= */

@media (max-width: 800px) {

  .topbar {

    padding:
      13px 15px;
  }


  .chapter-title {

    font-size:
      9px;

    letter-spacing:
      2px;
  }


  .back {

    font-size:
      9px;

    letter-spacing:
      1px;
  }


  .reader {

    padding:
      15px 8px 80px;
  }


  .spread {

    gap:
      4px;
  }


  .page {

    width:
      50%;

    max-width:
      none;
  }


  .controls {

    margin-top:
      25px;

    padding:
      0 5px;
  }


  .control {

    padding:
      11px 12px;

    font-size:
      9px;

    letter-spacing:
      1px;
  }


  .footer {

    padding:
      0 5px;

    font-size:
      8px;
  }

}


@media (max-width: 500px) {

  .spread {

    gap:
      2px;
  }


  .page {

    width:
      50%;
  }


  .chapter-title {

    max-width:
      120px;
  }

}

</style>

</head>


<body>


<!-- ========================= -->
<!-- TOP BAR -->
<!-- ========================= -->

<div class="topbar">


  <!-- TWO LEVELS UP = MAIN SK6 -->

  <a
    class="logo"
    href="../../"
  >

    SK6

  </a>


  <div class="chapter-title">

    L’HÉRITAGE DE LA NUIT
    //
    CHAPTER 01

  </div>


  <!-- ONE LEVEL UP = SERIES LANDING PAGE -->

  <a
    class="back"
    href="../"
  >

    Series

  </a>


</div>



<!-- ========================= -->
<!-- READER -->
<!-- ========================= -->

<main class="reader">


  <div
    class="spread"
    id="spread"
  >

  </div>



  <!-- NAVIGATION -->

  <div class="controls">


    <button
      class="control"
      id="previousButton"
      onclick="previousSpread()"
    >

      ← Previous

    </button>


    <button
      class="control"
      id="nextButton"
      onclick="nextSpread()"
    >

      Next →

    </button>


  </div>



  <!-- COUNTER -->

  <div
    class="counter"
    id="counter"
  >

    PAGES 1–2 / 19

  </div>



  <!-- FOOTER -->

  <div class="footer">


    <span>

      SK6 // L’HÉRITAGE DE LA NUIT

    </span>


    <span>

      001 / 019

    </span>


  </div>


</main>



<script>


/* ========================= */
/* SETTINGS */
/* ========================= */

const totalPages = 19;

let currentSpread = 0;


/* ========================= */
/* ELEMENTS */
/* ========================= */

const spread =
  document.getElementById(
    "spread"
  );

const counter =
  document.getElementById(
    "counter"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const previousButton =
  document.getElementById(
    "previousButton"
  );


/* ========================= */
/* FILENAMES */
/* ========================= */

function getFilename(page) {

  const number =
    String(page).padStart(2, "0");

  return (
    "H_c1_" +
    number +
    "%20Large.jpeg"
  );

}


/* ========================= */
/* DISPLAY SPREAD */
/* ========================= */

function showSpread() {

  spread.innerHTML = "";


  const firstPage =
    currentSpread * 2 + 1;

  const secondPage =
    firstPage + 1;


  /* FIRST PAGE */

  if (
    firstPage <= totalPages
  ) {

    const img1 =
      document.createElement(
        "img"
      );

    img1.className =
      "page";

    img1.src =
      getFilename(
        firstPage
      );

    img1.alt =
      "L’Héritage de la Nuit — Page " +
      firstPage;

    spread.appendChild(
      img1
    );

  }


  /* SECOND PAGE */

  if (
    secondPage <= totalPages
  ) {

    const img2 =
      document.createElement(
        "img"
      );

    img2.className =
      "page";

    img2.src =
      getFilename(
        secondPage
      );

    img2.alt =
      "L’Héritage de la Nuit — Page " +
      secondPage;

    spread.appendChild(
      img2
    );

  }


  /* COUNTER */

  if (
    secondPage <= totalPages
  ) {

    counter.textContent =
      "PAGES " +
      firstPage +
      "–" +
      secondPage +
      " / " +
      totalPages;

  } else {

    counter.textContent =
      "PAGE " +
      firstPage +
      " / " +
      totalPages;

  }


  /* BUTTONS */

  previousButton.disabled =
    currentSpread === 0;

  nextButton.disabled =
    secondPage >= totalPages;

}


/* ========================= */
/* NEXT */
/* ========================= */

function nextSpread() {

  const lastSpread =
    Math.ceil(
      totalPages / 2
    ) - 1;


  if (
    currentSpread <
    lastSpread
  ) {

    currentSpread++;

    showSpread();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* ========================= */
/* PREVIOUS */
/* ========================= */

function previousSpread() {

  if (
    currentSpread > 0
  ) {

    currentSpread--;

    showSpread();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

}


/* ========================= */
/* KEYBOARD */
/* ========================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "ArrowRight"
    ) {

      nextSpread();

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      previousSpread();

    }

  }
);


/* ========================= */
/* START */
/* ========================= */

showSpread();

</script>


</body>

</html>
