<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Comic</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: #181818;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 8px;
      color: #aaa;
    }

    .comic {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .comic img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      background: white;
      color: #111;
      border: none;
      padding: 12px 22px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>MY COMIC</h1>
    <div class="subtitle">Read the comic online</div>
  </header>

  <main class="comic">

    <h2>Chapter 1</h2>

    <p>Your comic will appear here.</p>

    <div class="buttons">
      <button>Previous</button>
      <button>Next</button>
    </div>

  </main>

  <footer>
    © 2026 My Comic
  </footer>

</body>
</html>
