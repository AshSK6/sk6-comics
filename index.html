<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SK6 — Comics</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
      background: #181818;
    }

    h1 {
      font-size: 56px;
      margin: 0;
      letter-spacing: 6px;
    }

    header p {
      color: #999;
      font-size: 18px;
      margin-top: 10px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 50px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 30px;
    }

    .comics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    .comic {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 25px;
      text-align: center;
    }

    .comic h3 {
      font-size: 24px;
      margin-top: 0;
    }

    .comic p {
      color: #aaa;
      line-height: 1.5;
    }

    .comic a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .comic a:hover {
      opacity: 0.8;
    }

    footer {
      text-align: center;
      padding: 50px 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>SK6</h1>
    <p>Independent comics & stories</p>
  </header>

  <main>

    <h2>OUR COMICS</h2>

    <div class="comics">

      <div class="comic">
        <h3>9mm Girls</h3>
        <p>
          A story about guns, girls, cars and questionable life choices.
        </p>

        <a href="9mm-girls/">READ</a>
      </div>

      <div class="comic">
        <h3>Freaky 1/2</h3>
        <p>
          Another strange little universe from SK6.
        </p>

        <a href="freaky-1-2/">READ</a>
      </div>

      <div class="comic">
        <h3>More Coming Soon</h3>
        <p>
          More comics and stories from SK6.
        </p>
      </div>

    </div>

  </main>

  <footer>
    © 2026 SK6
  </footer>

</body>
</html>
