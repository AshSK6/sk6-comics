<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SK6 — Comics / Art / Chaos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px 60px;
    }

    header {
      border-bottom: 5px solid #eee;
      padding: 20px 0 25px;
      margin-bottom: 45px;
    }

    .logo {
      font-size: clamp(90px, 20vw, 190px);
      font-weight: 900;
      line-height: .75;
      letter-spacing: -12px;
      transform: rotate(-2deg);
      display: inline-block;
    }

    .tagline {
      margin-top: 25px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .stamp {
      display: inline-block;
      margin-top: 18px;
      background: #eee;
      color: #111;
      padding: 8px 14px;
      font-weight: 900;
      transform: rotate(2deg);
      text-transform: uppercase;
    }

    .section-title {
      font-size: clamp(36px, 7vw, 65px);
      font-weight: 900;
      text-transform: uppercase;
      margin: 0 0 35px;
      letter-spacing: -3px;
      transform: rotate(-1deg);
      display: inline-block;
    }

    .comics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 35px;
    }

    .comic {
      background: #eee;
      color: #111;
      padding: 12px;
      text-decoration: none;
      display: block;
      box-shadow: 9px 9px 0 #000;
      transition: transform .15s ease;
    }

    .comic:nth-child(1) {
      transform: rotate(-1.5deg);
    }

    .comic:nth-child(2) {
      transform: rotate(1.5deg);
    }

    .comic:nth-child(3) {
      transform: rotate(-1deg);
    }

    .comic:hover {
      transform: rotate(0deg) scale(1.03);
    }

    .cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-weight: 900;
      font-size: 24px;
      text-align: center;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      padding: 16px 5px 8px;
    }

    .title {
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .description {
      margin-top: 6px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      line-height: 1.4;
    }

    .read {
      display: inline-block;
      margin-top: 12px;
      background: #111;
      color: #eee;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    footer {
      margin-top: 80px;
      border-top: 5px solid #eee;
      padding-top: 20px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <div class="page">

    <header>

      <div class="logo">SK6</div>

      <div class="tagline">
        Comics / Art / Chaos
      </div>

      <div class="stamp">
        No rules. Just comics.
      </div>

    </header>


    <main>

      <div class="section-title">
        Our Comics
      </div>


      <div class="comics">


        <!-- 9MM GIRLS -->

        <a class="comic" href="9mm-girls/">

          <div class="cover">
            <img src="9mm-girls/1.jpg" alt="9mm Girls">
          </div>

          <div class="info">

            <div class="title">
              9mm Girls
            </div>

            <div class="description">
              Guns. Girls. Cars. Questionable life choices.
            </div>

            <div class="read">
              Read →
            </div>

          </div>

        </a>


        <!-- FREAKY 1/2 -->

        <a class="comic" href="freaky-1-2/">

          <div class="cover">
            FREAKY 1/2
          </div>

          <div class="info">

            <div class="title">
              Freaky 1/2
            </div>

            <div class="description">
              Another strange little universe from SK6.
            </div>

            <div class="read">
              Read →
            </div>

          </div>

        </a>


        <!-- MORE COMICS -->

        <div class="comic">

          <div class="cover">
            MORE<br>
            COMING<br>
            SOON
          </div>

          <div class="info">

            <div class="title">
              More
            </div>

            <div class="description">
              More comics and stories from SK6.
            </div>

          </div>

        </div>


      </div>

    </main>


    <footer>
      SK6 © 2026 — Independent Comics / Art / Chaos
    </footer>

  </div>

</body>
</html>
