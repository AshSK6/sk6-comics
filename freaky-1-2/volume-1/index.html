<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Freaky 1/2 — Chapter 01</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --black: #080808;
      --white: #f2f2ee;
      --blue: #5ecbff;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: var(--black);
      color: var(--white);

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }


    /* HEADER */

    header {

      width: 100%;

      padding:
        16px
        25px;

      border-bottom:
        2px solid
        var(--white);

      display: flex;

      align-items: center;

      justify-content: space-between;

      position: relative;

      z-index: 20;
    }


    .back {

      color: var(--blue);

      text-decoration: none;

      font-size: 11px;

      font-weight: 900;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    .back:hover {
      color: var(--white);
    }


    .title {

      font-size: 17px;

      font-weight: 900;

      letter-spacing: 3px;

      text-transform: uppercase;

      text-align: center;
    }


    .volume {

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 2px;

      color: var(--blue);

      text-transform: uppercase;
    }


    /* READER */

    .reader {

      width: 100%;

      min-height:
        calc(100vh - 120px);

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        20px
        20px
        100px;
    }


    /* SPREAD */

    .spread {

      display: flex;

      flex-direction: row-reverse;

      align-items: stretch;

      justify-content: center;

      width: auto;

      max-width: 100%;

      gap: 0;

      line-height: 0;

      background: var(--black);
    }


    /* PAGES */

    .page {

      display: block;

      width: auto;

      height:
        calc(100vh - 180px);

      max-width: 50vw;

      object-fit: contain;

      margin: 0;

      padding: 0;

      border: 0;

      box-shadow: none;

      background: transparent;
    }


    /* CONTROLS */

    .controls {

      position: fixed;

      bottom: 0;

      left: 0;

      width: 100%;

      padding:
        12px
        20px
        15px;

      background:
        rgba(8,8,8,.97);

      border-top:
        2px solid
        var(--white);

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 15px;

      z-index: 100;
    }


    button {

      border: none;

      background: var(--white);

      color: var(--black);

      padding:
        10px
        17px;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 2px;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        background .15s ease,
        color .15s ease;
    }


    button:hover {

      background: var(--blue);

      color: var(--black);
    }


    button:disabled {

      opacity: .25;

      cursor: default;
    }


    .page-count {

      min-width: 100px;

      text-align: center;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 2px;

      color: var(--blue);
    }


    /* DIRECTION */

    .reading-direction {

      position: fixed;

      top: 65px;

      right: 18px;

      z-index: 50;

      font-size: 8px;

      font-weight: 900;

      letter-spacing: 2px;

      color: var(--blue);

      text-transform: uppercase;

      opacity: .65;
    }


    /* MOBILE */

    @media (max-width: 750px) {

      header {

        padding:
          14px
          15px;

        justify-content: center;
      }


      .back {

        position: absolute;

        left: 15px;
      }


      .volume {

        display: none;
      }


      .title {

        font-size: 14px;

        letter-spacing: 2px;
      }


      .reader {

        padding:
          10px
          8px
          85px;

        min-height:
          calc(100vh - 65px);
      }


      .spread {

        width: 100%;

        display: block;

        text-align: center;
      }


      .page {

        width: auto;

        max-width: 100%;

        height:
          calc(100vh - 125px);

        max-height:
          calc(100vh - 125px);

        object-fit: contain;

        margin: 0 auto;
      }


      .page.second-page {

        display: none;
      }


      .reading-direction {

        top: 55px;

        right: 8px;

        font-size: 7px;
      }


      .controls {

        padding:
          10px
          8px
          12px;

        gap: 7px;
      }


      button {

        padding:
          9px
          11px;

        font-size: 8px;

        letter-spacing: 1px;
      }


      .page-count {

        min-width: 65px;

        font-size: 8px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <a
      class="back"
      href="../"
    >
      ← Chapters
    </a>


    <div class="title">
      FREAKY 1/2
    </div>


    <div class="volume">
      Chapter 01
    </div>

  </header>


  <!-- READING DIRECTION -->

  <div class="reading-direction">
    Manga // Right → Left
  </div>


  <!-- READER -->

  <main class="reader">

    <div class="spread">


      <!-- LEFT PAGE -->

      <img
        id="leftPage"
        class="page second-page"
        src="Fr1-02.jpeg"
        alt="Freaky 1/2 page 2"
      >


      <!-- RIGHT PAGE -->

      <img
        id="rightPage"
        class="page"
        src="Fr1-01.jpeg"
        alt="Freaky 1/2 page 1"
      >

    </div>

  </main>


  <!-- CONTROLS -->

  <div class="controls">


    <button
      id="previousButton"
      onclick="previousSpread()"
    >
      ← Previous
    </button>


    <div
      class="page-count"
      id="pageCount"
    >
      1 — 2 / 54
    </div>


    <button
      id="nextButton"
      onclick="nextSpread()"
    >
      Next →
    </button>


  </div>


  <script>

    const totalPages = 54;

    let currentPage = 1;


    const rightPage =
      document.getElementById("rightPage");

    const leftPage =
      document.getElementById("leftPage");

    const pageCount =
      document.getElementById("pageCount");

    const previousButton =
      document.getElementById("previousButton");

    const nextButton =
      document.getElementById("nextButton");


    function updateReader() {


      /* RIGHT PAGE */

      rightPage.src =
        "Fr1-" +
        String(currentPage).padStart(2, "0") +
        ".jpeg";


      rightPage.alt =
        "Freaky 1/2 page " +
        currentPage;


      /* LEFT PAGE */

      if (
        currentPage + 1 <=
        totalPages
      ) {

        leftPage.src =
          "Fr1-" +
          String(currentPage + 1)
            .padStart(2, "0") +
          ".jpeg";


        leftPage.alt =
          "Freaky 1/2 page " +
          (currentPage + 1);


        leftPage.style.display =
          "block";

      } else {

        leftPage.style.display =
          "none";

      }


      /* PAGE COUNTER */

      pageCount.textContent =
        currentPage +
        " — " +
        Math.min(
          currentPage + 1,
          totalPages
        ) +
        " / " +
        totalPages;


      /* BUTTONS */

      previousButton.disabled =
        currentPage === 1;


      nextButton.disabled =
        currentPage + 2 >
        totalPages;

    }


    /* NEXT */

    function nextSpread() {

      if (
        currentPage + 2 <=
        totalPages
      ) {

        currentPage += 2;

        updateReader();

      }

    }


    /* PREVIOUS */

    function previousSpread() {

      if (
        currentPage - 2 >=
        1
      ) {

        currentPage -= 2;

        updateReader();

      }

    }


    /* KEYBOARD */

    document.addEventListener(
      "keydown",
      function(event) {


        if (
          event.key ===
          "ArrowRight"
        ) {

          nextSpread();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          previousSpread();

        }

      }
    );


    /* START */

    updateReader();

  </script>


</body>

</html>
